# Curated object pools for the RulesPlanner (spec §15, §15.4). Working candidates, NOT approved art plans.
# Each micro-theme = one alternative 10-card set idea. Entry format: "Object name | short description".
#   simple : suits Cat. 1-2 (and 3-4) - clean silhouette, no small details
#   scene3 : suits Cat. 3 (object on a realistic surface)
#   scene4 : suits Cat. 4 (object as the focus of a recognizable environment)
# gold (genre level): Category 5 golden cards = key characters (max 2) in an ironic, emotional situation; unique across variants.
# Default [2,2,3,3] needs 4 simple + 3 scene3 + 3 scene4 per micro-theme; 5 simple allows 5 Cat. 1-2 cards x 5 variants. No franchise names/logos, no weapons.
version: pools_v1
