# Category composition rules (spec v1.7 §3.2 + §3.4 "Category prompt logic").
# Categories 1-4 are the standard art categories. Category 5 (golden) = KEY CHARACTERS of the collection. The per-category card COUNT is a separate,
# configurable Card Category Distribution (see category_distribution.py), not defined here.
version: category_v1
categories:
  1:
    name: Simple floating object
    composition: A simple object with no small details, floating in the air with no ground and no surface.
    background: Simple background only - a flat color, a gradient, a simple repeating pattern or light rays. No room, no realistic ground.
  2:
    name: Simple object on a simple surface
    composition: A simple object with no small details, placed on a simple surface.
    background: A simple vertical background behind the surface. Keep the whole image clean and minimal; do not turn it into a complex scene.
  3:
    name: Collectible on a context-appropriate physical surface, in stylized casual-game 3D
    composition: The object is placed on a more realistic surface in a more volumetric scene, and stays centered and readable.
    background: A volumetric spatial background with depth, in stylized casual-game realism (not photographic). The object is still clearly the hero.
  4:
    name: Dominant collectible inside a simplified stylized contextual environment
    composition: The object is embedded in a realistic environment (stylized casual-game realism) and remains the central focus of the image.
    background: A full recognizable environment that tells a small local story. The object must not get lost in the decor.
  5:
    name: Golden card - key characters
    composition: >-
      Golden cards are the most valuable cards: the artwork shows the collection's KEY CHARACTERS playing out an ironic,
      emotional situation. At most 2 characters on one golden card. The characters are the hero of the image, expressive
      and readable (clear pose and emotion), in an original design (no existing franchise characters).
    background: A simple, supportive setting that tells the story of the ironic situation without clutter; the characters stay dominant and unobstructed.
golden_concept:
  enabled: true
  description: Narrative golden-card scene with one or two key characters in an ironic, emotional situation (max 2 characters).
