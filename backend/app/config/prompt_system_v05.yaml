# Prompt System v0.5 (producer-reviewed): the seven production image templates, copied verbatim from
# AI_Collection_Studio_Prompt_System_v0.5_reviewed.md (Sections 4, 5, 5.1). PromptLibrary.apply_v05() saves them ONCE as new
# permanent versions (v1 stays for rollback). Edit texts in the Prompt Library UI, not here.
version: v0.5
templates:
  system_style: |-
    Create ONE original square illustration for a premium casual mobile-game collectible. Render the ARTWORK only, never the finished card. The Object/Scene description determines WHAT is shown; the Category module determines HOW it is framed. Set and variant supply story and atmosphere, not photorealistic rendering instructions. Preserve mood through stylized colors, props and acting. Wishes never override category rules.

    VISUAL LANGUAGE: polished, softly dimensional 3D-cartoon artwork with chunky, simplified, carefully sculpted volumes; pleasing exaggeration; clean recognizable silhouettes; smooth curves, gentle bevels and deliberate medium-sized identifying details. Keep functional identity; avoid photos, film stills, painterly concept art or flat icons.

    SHAPE & DETAIL HIERARCHY: establish the hero's big silhouette first. Show only the few details that make it recognizable. Combine leaves, fur, snow, bark, cloth, metal fittings and masonry into larger readable groups. Avoid high-frequency grain, scratches, pores and incidental debris. Backgrounds are simpler, softer and lower-contrast than the hero. For Category 5, facial acting and gestures receive the highest visual priority.

    MATERIALS: differentiate painted metal, smooth wood, ceramic, cloth, glass, stone, snow and fur through color, large highlight shapes and gentle shading, without photographic textures. Vary matte, satin and glossy finishes; not uniform vinyl.

    LIGHT & COLOR: one clear, soft directional key with gentle fill, controlled ambient occlusion and contact shadows only where objects touch a surface. Broad highlights, open shadows, clean subject/background separation. Use a coherent, appealing palette with deliberate accents; keep even nighttime or mystery scenes readable and colorful rather than muddy or heavily graded. Avoid bloom, lens flare, thick fog, hard vignette and theatrical lighting.

    FRAMING: design for instant recognition around 96px. Categories 1–4 have one dominant named subject, properly scaled for that category; Category 5 has one or two prominent characters, or their interaction, as the focal point. Keep identifying parts visible. Choose the angle that best explains the object.

    SET COHESION: maintain the same degree of form simplification, soft lighting, color clarity, material treatment and silhouette legibility throughout the Set. Vary the subject and palette without drifting into different render styles.

    REFERENCES: if actual reference images are attached, match their overall form simplification, color relationships, material finish and category-level composition. Do not copy their objects, character identities or finished-card UI unless the specific character identity is explicitly supplied for that card. Without attached references, rely on these instructions.

    OUTPUT: one original standalone square artwork, no framing UI, rarity stars, labels, readable writing, logos or watermarks.
  category_1: |-
    CATEGORY 1 — ONE FLOATING OBJECT, GRAPHIC BACKDROP.
    Depict one recognizable object, unsupported and clearly floating. Give it a confident, substantial silhouette, an attractive angle when useful, and breathing room around its defining edges. NO tabletop, ground, snow bank, stand, pedestal, horizon, cast shadow or shadow ellipse below it. Background: one clean saturated color, a controlled gradient, or a restrained graphic motif (broad rings, rays or stripes) chosen to separate the hero clearly. The backdrop is a graphic field, NOT a place or a second object. A decorative motif is optional, not required on every card. No environmental props, scenery, drifting flakes, sparkles, bokeh or tiny ornament. Keep the object dimensional with a few purposeful material highlights and clearly visible identifying features.
  category_2: |-
    CATEGORY 2 — HERO ON ONE SIMPLE SUPPORT.
    Show one large, clearly recognizable collectible object resting convincingly on one uncomplicated horizontal surface: a smooth tabletop, clean board, broad stone, plain mat or simple snow/sand shelf if the subject calls for it. Include one soft contact shadow so the object feels grounded. Use a plain, saturated or gently graded background with at most a subtle graphic color motif. The surface is only a support, not the beginning of a full room or landscape; keep it simple in shape and texture. No shelves, forest, interior furnishings, distant structures or decorative collections. Add a secondary component only if it is essential to the identity of the named subject. The hero remains the immediate focus; Category 2 is richer than Category 1 only through clear grounding.
  category_3: |-
    CATEGORY 3 — HERO WITH IMMEDIATE CONTEXTUAL SURFACE.
    Show one named hero as the unmistakable focus, naturally placed on, against or formed within its immediate setting: a branch, log, path, rock, workbench, deck, grass, snow or sand. This support should communicate the Set through a few broad stylized shapes, not through photorealistic texture. Use gentle perspective, believable contact and modest local depth. Frame closely: the hero and its immediate surface hold most attention; the wider location is suggested by a soft, subordinate color zone or a few large blurred shapes. One or two small context cues are acceptable only when they clarify the hero. If the named subject is inherently spatial (tracks, stream, nest, burrow), show its distinctive close-up feature as a bounded collectible composition, not a landscape or wide establishing shot. No crowded interiors, intricate foliage, dozens of snow flecks, distant focal points or environmental takeover. Richer support and context than Category 2, but clearly less scene depth than Category 4.
  category_4: |-
    CATEGORY 4 — LARGE NAMED HERO INSIDE A READABLE ENVIRONMENT.
    One specifically named object, feature, structure or permitted character must be the visual hero: prominent, clearly defined, and more visually assertive than its surroundings. Depict a recognizable environment that explains the Set and enriches the subject, but simplify it into a few large readable elements: a ground plane, one or two meaningful context shapes and a quiet background. The hero's silhouette, color contrast and defining details lead the eye. Allow more visible spatial storytelling than Category 3 without expanding into a panoramic landscape or a detailed room illustration. Choose only the environment cues needed to identify place or activity; avoid busy props, distant miniatures, dense foliage, realistic brick/bark textures and atmospheric clutter. If the CardSpec names a place-like feature (a hollow, nest, creek or burrow), frame that feature itself as a compact, recognizable foreground hero; include a character or animal only if the CardSpec calls for one. Do not silently change the planned subject to a different one. Keep a charming stylized depth and coherent soft lighting.
  category_5: |-
    CATEGORY 5 — GOLDEN CHARACTER MINI-STORY.
    Tell one instantly readable funny, ironic, surprising or touching story beat with exactly the ONE or TWO key characters specified in the plan; never invent a third character. With two characters, their expressive interaction is the visual focus. Favor close or medium framing so heads, faces, hands and gestures carry the story at mobile size. Use appealing, stylized character proportions, expressive eyes and mouths, clear posing, simplified clothing and grouped fur or hair shapes. Preserve character identity and the intended emotional beat; avoid realistic pores, cinematic skin shading, tiny folds and overcomplicated anatomy.

    Use only essential story props, generally one or two; additional props are acceptable only when the gag cannot be understood without them. Suggest the location with a few bold, recognizable and softer background shapes, keeping the characters brighter, larger and easier to read. A nighttime, rainy, mysterious or dramatic Detective scenario may retain those STORY cues, but depict them as clean cartoon shapes and controlled color—not dark photorealistic cinema, wet micro-textures, foggy alleys or heavy light effects. Avoid crowd faces, dense set dressing and unrelated decorative details. Golden means emotional narrative value, not mandatory gold tint, glow, metal, frame or rarity symbols. Keep one-character and two-character scenes both valid.
  image_closing: 'FINAL QUALITY CHECK: depict exactly the requested named subject and preserve its distinguishing features. Follow the selected art category''s support, environment and focal hierarchy: floating object for Cat 1; simple support for Cat 2; bounded immediate context for Cat 3; prominent hero plus simplified recognizable environment for Cat 4; expressive one- or two-character story for Cat 5. Favor a strong silhouette and legible emotion at thumbnail size. Simplify secondary shapes before removing important story or subject details. Materials are stylized and dimensional, colors remain clear, and lighting stays soft and controlled. Avoid excessive microtexture, distracting particles, heavy effects, realistic pores, busy scenery and competing focal points; weather or mood cues are allowed when truly relevant and visually restrained. Do not draw writing, logos, numbers, card frames, stars, badges, UI or watermarks. Output ONE original square artwork only, with no explanation.'
